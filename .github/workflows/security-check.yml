name: MiniCatalog Security Checks

on:
  push:
    branches: ["main", "security-fix-3-1"]
  pull_request:
    branches: ["main"]

permissions:
  contents: read

jobs:
  security-check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Run smoke and security checks
        run: node tools/smoke-test.mjs
