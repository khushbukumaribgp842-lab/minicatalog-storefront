name: Validate MiniCatalog changes

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Check HTML IDs and JavaScript syntax
        run: |
          python3 - <<'PY'
          import pathlib, re
          html = pathlib.Path("index.html").read_text(encoding="utf-8")
          scripts = re.findall(r"<script\b[^>]*>(.*?)</script\s*>", html, flags=re.I | re.S)
          if len(scripts) != 1:
              raise SystemExit(f"Expected one intact main script, found {len(scripts)}.")
          ids = re.findall(r"""\bid=["']([^"']+)["']""", html)
          duplicates = sorted({item for item in ids if ids.count(item) > 1})
          if duplicates:
              raise SystemExit("Duplicate HTML IDs: " + ", ".join(duplicates))
          refs = set(re.findall(r"""\$\(["']([^"']+)["']\)""", scripts[0]))
          missing = sorted(refs - set(ids))
          if missing:
              raise SystemExit("JavaScript references missing HTML IDs: " + ", ".join(missing))
          pathlib.Path("/tmp/minicatalog-inline.js").write_text(scripts[0], encoding="utf-8")
          print(f"Checked {len(ids)} IDs and extracted the main JavaScript.")
          PY
          node --check /tmp/minicatalog-inline.js
      - name: Verify upgrade features are present
        run: |
          python3 - <<'PY'
          from pathlib import Path
          html = Path("index.html").read_text(encoding="utf-8")
          required = [
              'id="themeSelect"', 'id="densitySelect"', 'id="sortBy"',
              'minicatalog_theme_v1', 'minicatalog_density_v1',
              'minicatalog_cart_v1', 'minicatalog_sales_v1',
              'Checkout on WhatsApp', 'Export storefront HTML',
              'const DEMO_PRODUCTS =', 'normalizeDemoProducts(products)',
              'Demo products are already in your catalog. No duplicates were added.'
          ]
          missing = [item for item in required if item not in html]
          if missing:
              raise SystemExit("Missing expected storefront feature(s): " + ", ".join(missing))
          print("Theme, layout, sorting, cart, sales and export features found.")
          PY

      - name: Verify demo deduplication and preview rendering
        run: |
          python3 - <<'PY'
          from pathlib import Path
          html = Path("index.html").read_text(encoding="utf-8")
          if html.count("const DEMO_PRODUCTS =") != 1:
              raise SystemExit("Expected one shared demo product list.")
          if "const demo = [" in html:
              raise SystemExit("Old repeated demo seed list still exists.")
          if html.count('card.appendChild(element("strong", "", p.name))') != 1:
              raise SystemExit("Preview should append each product name once per card.")
          if "seenDemoNames.has(seed.name)" not in html:
              raise SystemExit("Startup duplicate cleanup is missing.")
          if "existingDemoNames" not in html or "missingDemo" not in html:
              raise SystemExit("Demo button does not skip products already in the catalog.")
          if 'category:product.category || seed.category' not in html:
              raise SystemExit("Known demo categories must be used as fallback without overwriting seller edits.")
          if 'name:"Gaming Mouse",category:"Gaming",price:900,description:""' not in html:
              raise SystemExit("Gaming Mouse demo category migration is missing.")
          if 'product.name.match(/^(.*) \\(Copy\\)$/i)' not in html:
              raise SystemExit("Copied built-in demo cleanup is missing.")
          if 'img.alt = p.name' in html:
              raise SystemExit("Product image alt text may duplicate the visible product title.")
          if html.count('img.alt = ""; img.setAttribute("aria-hidden", "true")') != 2:
              raise SystemExit("Both catalog and preview images should be decorative to avoid duplicate labels.")
          print("Demo deduplication, category migration and preview rendering checks passed.")
          PY
